name: Validate Project Command Board

on:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/validate_command_board.mjs', '.github/workflows/validate-command-board.yml']
  pull_request:
    paths: ['index.html', 'scripts/validate_command_board.mjs', '.github/workflows/validate-command-board.yml']

permissions:
  contents: read

jobs:
  command-board:
    name: Blank-page and data-render regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate_command_board.mjs
